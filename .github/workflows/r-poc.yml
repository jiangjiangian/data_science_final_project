name: R Phase A POC smoke test

# 觸發條件: 任何 push 到開發 branch / 對 main 開的 PR
on:
  push:
    branches:
      - 'claude/**'
      - 'main'
  pull_request:
    branches:
      - main
  workflow_dispatch:  # 允許手動觸發

jobs:
  smoke-test:
    name: Run synthetic POC on Ubuntu R-${{ matrix.r-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        r-version: ["4.4.1"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true  # 預編譯二進位, 不需源碼編譯

      - name: Install system deps (for some R packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::purrr
            any::tibble
            any::readr
            any::here
            any::logger
            any::jsonlite
            any::rsample
            any::recipes
            any::parsnip
            any::workflows
            any::yardstick
            any::tune
            any::glmnet
            any::ranger
          dependencies: '"hard"'  # Skip Suggests to save time

      - name: Sanity check — R scripts have no syntax errors
        run: |
          set -e
          for f in R/elo_pythag.R R/poc/build_recipes.R \
                   R/poc/00_synthetic_smoke.R \
                   R/poc/03a_phase_a_poc.R \
                   R/poc/00_session_info.R; do
            echo "=== Parsing $f ==="
            Rscript -e "parse(file = '$f'); cat('OK:', '$f', '\\n')"
          done

      - name: Generate synthetic data
        run: |
          mkdir -p data/processed
          Rscript R/poc/00_synthetic_smoke.R

      - name: Run Phase A POC pipeline
        run: |
          mkdir -p models/poc Results/figures
          Rscript R/poc/03a_phase_a_poc.R

      - name: Dump session info
        if: always()
        run: |
          mkdir -p Results
          Rscript R/poc/00_session_info.R || true

      - name: Upload POC artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-results-r${{ matrix.r-version }}
          path: |
            models/poc/poc_results.rds
            Results/figures/poc_model_comparison.csv
            Results/session_info.txt
          if-no-files-found: warn
          retention-days: 14
